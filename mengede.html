<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mengede</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --blue-light:#eff6ff;
    --bg:#f7f8fb;
    color-scheme: light;
  }
  *{font-family:'Inter',system-ui,sans-serif;}
  body{background:var(--bg);}
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;color:#4b5563;font-size:14.5px;font-weight:500;cursor:pointer;transition:background .15s, color .15s;}
  .nav-item:hover{background:#f3f4f6;}
  .nav-item.active{background:var(--blue-light);color:var(--blue);}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;}
  .pill{border-radius:999px;padding:6px 16px;font-size:13.5px;font-weight:500;border:1px solid #e5e7eb;color:#374151;cursor:pointer;white-space:nowrap;}
  .pill.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn-primary{background:var(--blue);color:#fff;font-weight:600;border-radius:10px;transition:background .15s;}
  .btn-primary:hover{background:var(--blue-dark);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px;}
  .page{display:none;}
  .page.active{display:block;}
  .chat-bubble-user{background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;}
  .chat-bubble-ai{background:#fff;border:1px solid #e5e7eb;border-radius:16px 16px 16px 4px;}
  @media (max-width: 860px){
    #sidebar{transform:translateX(-100%);}
    #sidebar.open{transform:translateX(0);}
    main{margin-left:0 !important;}
  }

  /* ---------------- DARK MODE ---------------- */
  html.dark body{background:#0b1220;color:#e2e8f0;}
  html.dark #sidebar{background:#0f172a !important;border-color:#1e293b !important;}
  html.dark .card,
  html.dark [class*="bg-white"]{background:#141c2e !important;border-color:#243040 !important;}
  html.dark .nav-item{color:#94a3b8;}
  html.dark .nav-item:hover{background:#1e293b;}
  html.dark .nav-item.active{background:#173257;color:#7ab0ff;}
  html.dark input, html.dark select, html.dark textarea{background:#141c2e !important;border-color:#243040 !important;color:#e2e8f0 !important;}
  html.dark input::placeholder, html.dark textarea::placeholder{color:#64748b;}
  html.dark .pill{background:#141c2e;border-color:#243040;color:#cbd5e1;}
  html.dark .pill.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  html.dark .chat-bubble-ai{background:#141c2e;border-color:#243040;}
  html.dark .text-slate-900{color:#f1f5f9 !important;}
  html.dark .text-slate-700{color:#cbd5e1 !important;}
  html.dark .text-slate-600{color:#b8c2d0 !important;}
  html.dark .text-slate-500{color:#94a3b8 !important;}
  html.dark .text-slate-400{color:#64748b !important;}
  html.dark .text-slate-300{color:#475569 !important;}
  html.dark .border-slate-200{border-color:#243040 !important;}
  html.dark .border-slate-100{border-color:#1e293b !important;}
  html.dark .border-dashed{border-color:#334155 !important;}
  html.dark .bg-blue-50{background:#132a4d !important;}
  html.dark .text-blue-600{color:#7ab0ff !important;}
  html.dark .bg-emerald-50{background:#062a1c !important;}
  html.dark .text-emerald-600{color:#6ee7b7 !important;}
  html.dark .bg-amber-50{background:#3a2a06 !important;}
  html.dark .text-amber-600{color:#fbbf24 !important;}
  html.dark .bg-teal-50{background:#042f2e !important;}
  html.dark .text-teal-600, html.dark .text-teal-500{color:#5eead4 !important;}
  html.dark .bg-rose-50{background:#3d0d1c !important;}
  html.dark .text-rose-600{color:#fda4af !important;}
  html.dark .bg-slate-50{background:#0b1220 !important;}
  html.dark .badge-streak{background:#3a2a06 !important;border-color:#5c4308 !important;color:#fbbf24 !important;}
  html.dark .badge-xp{background:#132a4d !important;border-color:#1d3a63 !important;color:#7ab0ff !important;}
  html.dark .badge-student{background:#132a4d !important;border-color:#1d3a63 !important;color:#7ab0ff !important;}
  html.dark .badge-xp2{background:#062a1c !important;border-color:#0c3d28 !important;color:#6ee7b7 !important;}
  html.dark .badge-tag{background:#1e293b !important;border-color:#334155 !important;color:#cbd5e1 !important;}
  /* ---------------- 3D ORB (AI assistant) ---------------- */
  .orb{position:relative;border-radius:50%;flex-shrink:0;overflow:hidden;isolation:isolate;
    background:radial-gradient(circle at 32% 28%, #8ecbff 0%, #3b82f6 38%, #1d4ed8 65%, #0d2a73 100%);
    box-shadow:0 0 22px 4px rgba(37,99,235,.4), inset -4px -6px 14px rgba(0,0,0,.35), inset 3px 4px 10px rgba(255,255,255,.35);
    animation:orbPulse 4.5s ease-in-out infinite;}
  .orb::before{content:'';position:absolute;inset:-25%;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,.5) 50deg, transparent 130deg, rgba(147,197,253,.6) 210deg, transparent 320deg);
    animation:orbSpin 5s linear infinite;mix-blend-mode:screen;}
  .orb .orb-blob{position:absolute;inset:14%;border-radius:44% 56% 62% 38% / 40% 46% 54% 60%;
    background:linear-gradient(140deg, rgba(255,255,255,.55), rgba(37,99,235,.05) 60%);
    filter:blur(1.5px);mix-blend-mode:overlay;
    animation:orbMorph 7s ease-in-out infinite, orbSpinRev 9s linear infinite;}
  .orb .orb-shine{position:absolute;top:14%;left:20%;width:30%;height:24%;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.9), transparent 72%);filter:blur(.5px);}
  .orb.orb-lg{width:84px;height:84px;}
  .orb.orb-md{width:44px;height:44px;}
  .orb.orb-sm{width:24px;height:24px;}
  .orb.orb-fab{width:60px;height:60px;}
  #assistantFab{transition:transform .18s ease;}
  #assistantFab:hover{transform:translateX(-50%) scale(1.08);}
  #assistantFab:active{transform:translateX(-50%) scale(.96);}
  .orb.thinking{animation-duration:1.6s;}
  .orb.thinking::before{animation-duration:2s;}
  @keyframes orbSpin{to{transform:rotate(360deg);}}
  @keyframes orbSpinRev{to{transform:rotate(-360deg);}}
  @keyframes orbMorph{
    0%,100%{border-radius:44% 56% 62% 38% / 40% 46% 54% 60%;}
    33%{border-radius:62% 38% 40% 60% / 56% 40% 60% 44%;}
    66%{border-radius:38% 62% 56% 44% / 64% 42% 58% 36%;}
  }
  @keyframes orbPulse{
    0%,100%{box-shadow:0 0 22px 4px rgba(37,99,235,.4), inset -4px -6px 14px rgba(0,0,0,.35), inset 3px 4px 10px rgba(255,255,255,.35);}
    50%{box-shadow:0 0 34px 9px rgba(37,99,235,.6), inset -4px -6px 14px rgba(0,0,0,.35), inset 3px 4px 10px rgba(255,255,255,.45);}
  }

  /* ---------------- GLASS TOGGLE (light/dark segmented switch) ---------------- */
  .glass-toggle{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#e5e7eb;border-radius:999px;padding:3px;cursor:pointer;margin-bottom:8px;}
  .glass-toggle-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;
    background:linear-gradient(160deg, rgba(255,255,255,.95), rgba(255,255,255,.6));
    box-shadow:0 2px 6px rgba(0,0,0,.18), inset 0 1px 1px rgba(255,255,255,.9);
    transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:0;}
  .glass-toggle-thumb.right{transform:translateX(100%);}
  .glass-toggle-opt{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 0;font-size:12.5px;font-weight:600;color:#9ca3af;transition:color .2s;}
  .glass-toggle-opt .icon{width:14px;height:14px;}
  .glass-toggle-opt.active{color:#111827;}
  html.dark .glass-toggle{background:#1e293b;}
  html.dark .glass-toggle-thumb{background:linear-gradient(160deg, #2563eb, #1d4ed8);box-shadow:0 2px 8px rgba(37,99,235,.55), inset 0 1px 1px rgba(255,255,255,.25);}
  html.dark .glass-toggle-opt{color:#64748b;}
  html.dark .glass-toggle-opt.active{color:#fff;}

  /* ---------------- LIQUID GLASS BUTTONS (matches the theme toggle) ---------------- */
  .glass{position:relative;cursor:pointer;color:#111827;
    background:linear-gradient(160deg, rgba(255,255,255,.72), rgba(255,255,255,.26)) !important;
    -webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);
    border:1px solid rgba(255,255,255,.85) !important;
    box-shadow:0 4px 16px rgba(31,45,110,.14), 0 0 0 1px rgba(15,23,42,.04), inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(255,255,255,.45);
    transition:transform .2s cubic-bezier(.4,0,.2,1), box-shadow .2s, filter .2s;}
  .glass:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(31,45,110,.2), 0 0 0 1px rgba(15,23,42,.04), inset 0 1px 1px rgba(255,255,255,1), inset 0 -1px 2px rgba(255,255,255,.55);}
  .glass:active{transform:scale(.96);}
  .glass-amber{color:#c2410c !important;}
  .glass-blue-text{color:var(--blue) !important;}
  /* blue glass: primary buttons + active pills (same look as the dark toggle thumb) */
  .btn-primary, .pill.active{color:#fff !important;position:relative;cursor:pointer;
    background:linear-gradient(160deg, #3b82f6, #1d4ed8) !important;
    -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
    border:1px solid rgba(255,255,255,.28) !important;
    box-shadow:0 2px 8px rgba(37,99,235,.5), inset 0 1px 1px rgba(255,255,255,.35);
    transition:transform .2s cubic-bezier(.4,0,.2,1), box-shadow .2s, filter .2s;}
  .btn-primary:hover, .pill.active:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 6px 16px rgba(37,99,235,.55), inset 0 1px 1px rgba(255,255,255,.4);}
  .btn-primary:active, .pill.active:active{transform:scale(.96);}
  /* frosted glass on the blue "Complete Your Profile" banner */
  .glass.glass-onblue{color:#fff;
    background:linear-gradient(160deg, rgba(255,255,255,.38), rgba(255,255,255,.14)) !important;
    border:1px solid rgba(255,255,255,.5) !important;
    box-shadow:0 2px 10px rgba(0,0,0,.18), inset 0 1px 1px rgba(255,255,255,.6);}
  html.dark .glass{color:#e2e8f0;
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05)) !important;
    border:1px solid rgba(255,255,255,.14) !important;
    box-shadow:0 2px 10px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.28);}
  html.dark .glass:hover{box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.35);}
  html.dark .glass.glass-amber{color:#fbbf24 !important;}
  html.dark .glass.glass-blue-text{color:#7ab0ff !important;}
  html.dark .glass.glass-onblue{color:#fff;}
  html.dark .btn-primary, html.dark .pill.active{background:linear-gradient(160deg, #2563eb, #1d4ed8) !important;border-color:rgba(255,255,255,.2) !important;}

  /* ---------------- FROSTED SURFACES (translucent like the glass menu reference) ---------------- */
  body{background:
      radial-gradient(55% 45% at 12% 8%, rgba(96,165,250,.30), transparent 62%),
      radial-gradient(45% 40% at 92% 18%, rgba(167,139,250,.24), transparent 62%),
      radial-gradient(55% 45% at 65% 100%, rgba(45,212,191,.20), transparent 62%),
      var(--bg);background-attachment:fixed;}
  html.dark body{background:
      radial-gradient(55% 45% at 12% 8%, rgba(37,99,235,.28), transparent 62%),
      radial-gradient(45% 40% at 92% 18%, rgba(124,58,237,.20), transparent 62%),
      radial-gradient(55% 45% at 65% 100%, rgba(13,148,136,.16), transparent 62%),
      #0b1220;background-attachment:fixed;}
  #sidebar, .md\:hidden.fixed{background:rgba(255,255,255,.55) !important;border-color:rgba(255,255,255,.7) !important;
    -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);}
  .card{background:rgba(255,255,255,.62) !important;border:1px solid rgba(255,255,255,.8) !important;
    -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
    box-shadow:0 4px 18px rgba(31,45,110,.07), inset 0 1px 1px rgba(255,255,255,.9);}
  html.dark #sidebar, html.dark .md\:hidden.fixed{background:rgba(15,23,42,.6) !important;border-color:rgba(255,255,255,.08) !important;}
  html.dark .card{background:rgba(20,28,46,.6) !important;border:1px solid rgba(255,255,255,.09) !important;
    box-shadow:0 4px 18px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.08);}
  .glass-toggle{background:rgba(15,23,42,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 3px rgba(15,23,42,.12);}
  html.dark .glass-toggle{background:rgba(255,255,255,.07);}
  #bookingModal{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}

  /* ---------------- SETTINGS ---------------- */
  .switch{width:46px;height:28px;border-radius:999px;position:relative;cursor:pointer;flex-shrink:0;
    background:rgba(15,23,42,.14);box-shadow:inset 0 1px 3px rgba(15,23,42,.25);transition:background .25s;}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(160deg, rgba(255,255,255,1), rgba(255,255,255,.7));
    box-shadow:0 2px 6px rgba(0,0,0,.25), inset 0 1px 1px #fff;transition:transform .28s cubic-bezier(.4,0,.2,1);}
  .switch.on{background:linear-gradient(160deg,#3b82f6,#1d4ed8);box-shadow:0 2px 8px rgba(37,99,235,.45), inset 0 1px 1px rgba(255,255,255,.3);}
  .switch.on::after{transform:translateX(18px);}
  html.dark .switch{background:rgba(255,255,255,.12);}
  .voice-card{padding:16px;border-radius:16px;text-align:left;display:flex;flex-direction:column;gap:10px;}
  .voice-card.sel{box-shadow:0 0 0 2px var(--blue), 0 8px 22px rgba(37,99,235,.28), inset 0 1px 1px rgba(255,255,255,.9) !important;}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;}
  .set-row + .set-row{border-top:1px solid rgba(100,116,139,.18);}
  .speak-btn{padding:4px 10px;font-size:12px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;margin-top:6px;}
</style>
</head>
<body class="text-slate-900">

<div id="mobileOverlay" class="fixed inset-0 bg-black/30 z-30 hidden" onclick="toggleSidebar(false)"></div>

<button id="assistantFab" onclick="goto('assistant')" title="Ask Mengede AI"
  class="fixed bottom-6 left-1/2 z-40 flex items-center justify-center" style="transform:translateX(-50%);cursor:pointer;">
  <div id="assistantFabOrb"></div>
</button>

<!-- SIDEBAR -->
<aside id="sidebar" class="fixed top-0 left-0 h-screen w-64 bg-white border-r border-slate-200 flex flex-col z-40 transition-transform duration-200">
  <div class="flex items-center gap-2 px-5 h-16 border-b border-slate-100 shrink-0">
    <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white" id="logoIcon"></div>
    <span class="text-lg font-extrabold tracking-tight">Mengede<span class="text-blue-600">.</span></span>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1" id="navList"></nav>

  <div class="border-t border-slate-100 p-3">
    <div class="glass-toggle" id="themeToggle" onclick="toggleTheme()">
      <div class="glass-toggle-thumb" id="themeThumb"></div>
      <div class="glass-toggle-opt" id="optDark"><span class="icon-slot" data-icon="moon"></span> Dark</div>
      <div class="glass-toggle-opt" id="optLight"><span class="icon-slot" data-icon="sun"></span> Light</div>
    </div>
    <div class="nav-item" style="color:#6b7280" onclick="toggleSidebar(false)">
      <span class="icon-slot" data-icon="log-out"></span> Back to Home
    </div>
  </div>
</aside>

<!-- TOPBAR (mobile) -->
<div class="md:hidden fixed top-0 left-0 right-0 h-14 bg-white border-b border-slate-200 flex items-center px-4 z-20">
  <button onclick="toggleSidebar(true)" class="glass p-2 -ml-2 rounded-xl"><span class="icon-slot" data-icon="menu"></span></button>
  <span class="ml-2 font-bold">Mengede</span>
</div>

<main class="md:ml-64 mt-14 md:mt-0 min-h-screen">
  <div class="max-w-6xl mx-auto px-5 md:px-10 py-8" id="content"></div>
</main>

const SETTINGS_DEFAULT = {voice:'abebe', speak:true, rate:1, showStats:true};
let settings = Object.assign({}, SETTINGS_DEFAULT);
try{ Object.assign(settings, JSON.parse(localStorage.getItem('mengede-settings')||'{}')); }catch(e){}
function saveSettings(){ try{ localStorage.setItem('mengede-settings', JSON.stringify(settings)); }catch(e){} }

const VOICES = {
  abebe:   {name:'Abebe',   gender:'Male',   desc:'Deep, calm and steady', pitch:.8,  pitchFallback:.6},
  abebech: {name:'Abebech', gender:'Female', desc:'Bright, warm and clear', pitch:1.1, pitchFallback:1.35},
};
const MALE_HINT   = /\b(male|david|mark|daniel|alex|guy|george|james|richard|fred|tom|ryan|liam|eric|paul|thomas|oliver)\b/i;
const FEMALE_HINT = /\b(female|zira|samantha|susan|aria|jenny|hazel|karen|victoria|moira|tessa|fiona|allison|linda|emma|sara|serena|kate|google us english)\b/i;
function pickVoice(key){
  if(!('speechSynthesis' in window)) return {voice:null, matched:false};
  const all = speechSynthesis.getVoices();
  const am = all.find(v=>/^am/i.test(v.lang));
  if(am) return {voice:am, matched:true};
  const en = all.filter(v=>/^en/i.test(v.lang));
  const hint = key==='abebe' ? MALE_HINT : FEMALE_HINT;
  const other = key==='abebe' ? FEMALE_HINT : MALE_HINT;
  const m = en.find(v=>hint.test(v.name) && !(other.test(v.name) && !hint.test(v.name)));
  if(m) return {voice:m, matched:true};
  return {voice:en[0]||all[0]||null, matched:false};
}
function stripHTML(t){ const d=document.createElement('div'); d.innerHTML=t; return d.textContent||''; }
function speakText(text, key){
  if(!('speechSynthesis' in window)) return;
  key = key || settings.voice;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(stripHTML(text));
  const {voice, matched} = pickVoice(key);
  if(voice){ u.voice = voice; u.lang = voice.lang; }
  u.pitch = matched ? VOICES[key].pitch : VOICES[key].pitchFallback;
  u.rate = settings.rate;
  speechSynthesis.speak(u);
}
function stopSpeaking(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }
function maybeSpeak(text){ if(settings.speak) speakText(text); }
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ if(location.hash==='#settings') rerenderSettings(); };
}

function setSetting(k,v){ settings[k]=v; saveSettings(); rerenderSettings(); }
function rerenderSettings(){ const c=document.getElementById('content'); if(c && location.hash==='#settings') c.innerHTML = renderSettings(); }
function chooseVoice(k){ settings.voice=k; saveSettings(); rerenderSettings(); speakText(`Selam! I'm Mengede AI, and this is my ${VOICES[k].gender.toLowerCase()} voice, ${VOICES[k].name}.`, k); }
function themeChoice(dark){ applyTheme(dark); try{ localStorage.setItem('mengede-theme', dark?'dark':'light'); }catch(e){} rerenderSettings(); }
function clearChat(){ chatLog=[]; stopSpeaking(); rerenderSettings(); flash('Chat history cleared'); }
function clearBookings(){ bookings.length=0; rerenderSettings(); flash('Booked sessions cleared'); }
function resetSettings(){ settings=Object.assign({},SETTINGS_DEFAULT); saveSettings(); rerenderSettings(); flash('Settings reset'); }
function flash(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='glass'; t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:60;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;transition:opacity .3s'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity=1; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity=0,1800);
}

      : 'Your browser does not support spoken replies.'}</div>
    <div class="set-row">
      <div><div class="font-medium">Read replies aloud</div><div class="text-sm text-slate-500">Mengede AI speaks each new answer automatically</div></div>

    <div class="set-row">

  <div class="card p-5 mb-6">

      <div class="flex gap-2">

        <span class="pill glass ${dark?'active':''}" onclick="themeChoice(true)">${ic('moon','w-3.5 h-3.5 inline')} Dark</span>

  <div class="card p-5 mb-6">

function showThinking(done){
  const body = document.getElementById('chatBody');
  if(body){
    body.insertAdjacentHTML('beforeend', `<div class="flex items-center gap-2 mb-3" id="thinkingRow">${orbHTML('sm','thinking')}<span class="text-xs text-slate-400">Thinking…</span></div>`);
    body.scrollTop = body.scrollHeight;
  }
  setTimeout(done, 900);
}
function quickAsk(label){
  chatLog.push({role:'user', text:label});
  goto('assistant');
  showThinking(()=>{
    chatLog.push({role:'ai', text:`Here's what I'd suggest on "${label.toLowerCase()}" — (this is a UI placeholder; wire this up to your actual assistant logic).`});
    goto('assistant');
    maybeSpeak(chatLog[chatLog.length-1].text);
  });
}
function sendChat(){
  const inp = document.getElementById('chatInput');
  if(!inp.value.trim()) return;
  chatLog.push({role:'user', text:inp.value});
  inp.value='';
  goto('assistant');
  showThinking(()=>{
    chatLog.push({role:'ai', text:'(placeholder reply — connect this to your assistant backend)'});
    goto('assistant');
    maybeSpeak(chatLog[chatLog.length-1].text);
    setTimeout(()=>{ const b=document.getElementById('chatBody'); if(b) b.scrollTop=b.scrollHeight; },0);
  });
}

/* ---------------- PAYMENT + RECEIPT VERIFICATION ---------------- */
let payState = null;          // {i, slot, receipt:{...}|null, busy:false, error:''}
const usedReceipts = new Set(); // stops the same receipt being used twice

/* MOCK verifier. In production, send `ref` to YOUR backend (which holds the links.et API key),
   e.g. const r = await fetch('/api/verify-receipt',{method:'POST',body:JSON.stringify({ref})}); return r.json();
   The backend calls links.et and returns {ok, bank, amount, reference}. */
async function verifyReceipt(ref, expectedAmount){
  await new Promise(r=>setTimeout(r,1300));
  const t = ref.toLowerCase();
  const bank = /ethiotelecom|telebirr/.test(t)?'Telebirr' : /cbebirr/.test(t)?'CBE Birr' : /cbe|combanketh/.test(t)?'CBE' : /mpesa|safaricom/.test(t)?'M-PESA' : /awash/.test(t)?'Awash Bank' : /dashen/.test(t)?'Dashen Bank' : /zemen/.test(t)?'Zemen Bank' : /boa|abyssinia/.test(t)?'Bank of Abyssinia':'Bank transfer';
  if(ref.trim().length < 8) return {ok:false, error:'We couldn\'t find that receipt. Check the link or reference and try again.'};
  const toks = (ref.match(/[A-Za-z0-9]{8,}/g)||[]).filter(x=>/\d/.test(x));
  const reference = (toks.length?toks[toks.length-1]:ref.trim().slice(-10)).toUpperCase();
  return {ok:true, bank, amount:expectedAmount, reference};
}
function openPayment(i, slot){
  payState = {i, slot, receipt:null, busy:false, error:''};
  renderPayment();
  const modal = document.getElementById('bookingModal');
  modal.classList.remove('hidden'); modal.classList.add('flex');
}
function renderPayment(){
  const {i, slot, receipt, busy, error} = payState;
  const m = MENTORS[i];
  const prev = document.getElementById('payRef') ? document.getElementById('payRef').value : '';
  document.getElementById('bookingModalBody').innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div class="font-bold text-lg">Pay ${m.name}</div>
      <button onclick="closeBooking()" class="glass rounded-full p-1.5 text-slate-400">${ic('x')}</button>

    <div class="glass rounded-xl px-4 py-3 mb-4" style="cursor:default">
      <div class="flex justify-between text-sm"><span class="text-slate-500">Session</span><span class="font-medium">${slot}</span></div>
      <div class="flex justify-between text-sm mt-1"><span class="text-slate-500">Length</span><span class="font-medium">${m.duration} minutes</span></div>
      <div class="flex justify-between mt-2 pt-2" style="border-top:1px solid rgba(100,116,139,.2)"><span class="font-semibold">Amount to pay</span><span class="text-lg font-extrabold text-blue-600">ETB ${m.rate.toLocaleString()}</span></div>
    </div>
    <div class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Step 1 · Send the payment</div>
    <div class="glass rounded-xl px-4 py-3 mb-4 flex items-center justify-between gap-3" style="cursor:default">
      <div><div class="text-sm text-slate-500">${m.pay.method}</div><div class="font-bold tracking-wide">${m.pay.account}</div></div>
      <button class="glass rounded-lg px-3 py-1.5 text-xs font-medium" onclick="navigator.clipboard&&navigator.clipboard.writeText('${m.pay.account}');flash('Account copied')">Copy</button>
    </div>
    <div class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Step 2 · Verify your receipt</div>
    ${receipt ? `
      <div class="rounded-xl px-4 py-3 mb-4 bg-emerald-50" style="border:1px solid rgba(16,185,129,.35)">
        <div class="flex items-center gap-2 font-semibold text-emerald-600 mb-1">${ic('check','w-4 h-4')} Payment verified</div>
        <div class="text-sm text-slate-600">${receipt.bank} · Ref ${receipt.reference}</div>
        <div class="text-sm text-slate-600">ETB ${receipt.amount.toLocaleString()} received</div>
      </div>
      <button onclick="finishPayment()" class="btn-primary w-full py-2.5 text-sm flex items-center justify-center gap-2">${ic('calendar')} Confirm booking</button>
    ` : `
      <input id="payRef" value="${prev.replace(/"/g,'&quot;')}" placeholder="Paste receipt link or reference number" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-blue-400 mb-2" onkeydown="if(event.key==='Enter')runVerify()">
      <div class="text-xs text-slate-400 mb-3">e.g. transactioninfo.ethiotelecom.et/receipt/CH7A1B2C3D · Works with Telebirr, CBE, M-PESA, Awash, Dashen and more</div>
      ${error?`<div class="text-sm text-rose-600 mb-3">${error}</div>`:''}
      <button onclick="runVerify()" class="btn-primary w-full py-2.5 text-sm flex items-center justify-center gap-2" ${busy?'disabled style="opacity:.7"':''}>${busy?'Verifying with the bank…':ic('check')+' Verify payment'}</button>
    `}
    <button onclick="closeBooking()" class="w-full py-2.5 mt-3 rounded-xl glass text-sm font-medium">Cancel</button>`;
}
async function runVerify(){
  const ref = document.getElementById('payRef').value.trim();
  if(!ref){ payState.error='Paste your receipt link or reference first.'; renderPayment(); return; }
  const key = ref.toLowerCase();
  if(usedReceipts.has(key)){ payState.error='This receipt was already used for another booking.'; renderPayment(); return; }
  payState.busy=true; payState.error=''; renderPayment();
  const res = await verifyReceipt(ref, MENTORS[payState.i].rate);
  payState.busy=false;
  if(res.ok){ payState.receipt=res; payState.key=key; } else { payState.error=res.error; }
  renderPayment();
}
function finishPayment(){
  const {i, slot, receipt, key} = payState;
  const m = MENTORS[i];
  usedReceipts.add(key);
  bookings.push({name:m.name, initial:m.initial, color:m.color, slot, price:m.rate, paid:true, ref:receipt.reference, bank:receipt.bank});
  payState=null;
  closeBooking();
  goto('mentors');
  flash('Payment verified · session booked');
}

function goto(page){

  const fab = document.getElementById('assistantFab');

  toggleSidebar(false);
  window.scrollTo(0,0);
  location.hash = page;
}
window.addEventListener('hashchange', ()=>{
  const p = location.hash.replace('#','');
  if(RENDERERS[p]) goto(p);
});
goto(RENDERERS[location.hash.replace('#','')] ? location.hash.replace('#','') : 'dashboard');

/* ---------------- THEME ---------------- */
function applyTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  document.getElementById('themeThumb').classList.toggle('right', !dark);
  document.getElementById('optDark').classList.toggle('active', dark);
  document.getElementById('optLight').classList.toggle('active', !dark);
}
function toggleTheme(){
  const dark = !document.documentElement.classList.contains('dark');
  applyTheme(dark);
  try{ localStorage.setItem('mengede-theme', dark ? 'dark' : 'light'); }catch(e){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('mengede-theme'); }catch(e){}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved ? saved === 'dark' : prefersDark);
})();
</script>
